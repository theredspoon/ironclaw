[package]
name = "matrix-channel"
version = "0.1.0"
edition = "2021"
description = "Matrix homeserver channel for IronClaw (skeleton)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ironclaw_matrix_adapter = { path = "../../crates/ironclaw_matrix_adapter" }
ironclaw_product_adapters = { path = "../../crates/ironclaw_product_adapters" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
