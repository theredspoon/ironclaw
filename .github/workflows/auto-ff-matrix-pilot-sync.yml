name: Auto fast-forward Matrix pilot sync

on:
  workflow_run:
    workflows:
      - Code Style
      - Regression Test Check
      - nearai-bench dispatcher tests
      - Run Tests
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  fast-forward:
    if: github.repository == 'theredspoon/ironclaw'
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: native-matrix-channel-pilot
      SYNC_BRANCH: sync/native-matrix-pilot
      UPSTREAM_MIRROR_BRANCH: upstream-main
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Locate sync PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_json="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -F state=open \
              -F base="${BASE_BRANCH}" \
              -F head="${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" \
              --jq '.[0] // empty'
          )"

          if [[ -z "${pr_json}" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r '.number' <<<"${pr_json}")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<<"${pr_json}")" >> "$GITHUB_OUTPUT"

      - name: Check sync PR status
        if: steps.pr.outputs.found == 'true'
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          rollup="$(
            gh pr view "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json mergeStateStatus,mergeable \
              --jq '{mergeStateStatus, mergeable}'
          )"

          mergeable="$(jq -r '.mergeable' <<<"${rollup}")"
          merge_state="$(jq -r '.mergeStateStatus' <<<"${rollup}")"
          if [[ "${mergeable}" != "MERGEABLE" || "${merge_state}" != "CLEAN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "PR is not cleanly mergeable yet: mergeable=${mergeable}, mergeStateStatus=${merge_state}"
            exit 0
          fi

          checks_file="$(mktemp)"
          if ! gh pr checks "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json name,state,bucket,workflow > "${checks_file}"; then
            true
          fi

          pending="$(
            jq '[.[] | select(.bucket == "pending")] | length' "${checks_file}"
          )"
          failing="$(
            jq '[.[] | select(.bucket == "fail")] | length' "${checks_file}"
          )"

          if [[ "${pending}" != "0" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "PR still has ${pending} pending checks"
            exit 0
          fi

          if [[ "${failing}" != "0" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::PR has ${failing} failing checks"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Fast-forward Matrix pilot
        if: steps.checks.outputs.ready == 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" \
            "+refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" \
            "+refs/heads/${UPSTREAM_MIRROR_BRANCH}:refs/remotes/origin/${UPSTREAM_MIRROR_BRANCH}"

          actual_head="$(git rev-parse "origin/${SYNC_BRANCH}")"
          if [[ "${actual_head}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::Sync branch moved from ${EXPECTED_HEAD_SHA} to ${actual_head}; refusing to fast-forward"
            exit 1
          fi

          if ! git merge-base --is-ancestor "origin/${BASE_BRANCH}" "origin/${SYNC_BRANCH}"; then
            echo "::error::${BASE_BRANCH} is not an ancestor of ${SYNC_BRANCH}; rerun upstream sync to rebuild the sync branch"
            exit 1
          fi

          if ! git merge-base --is-ancestor "origin/${UPSTREAM_MIRROR_BRANCH}" "origin/${SYNC_BRANCH}"; then
            echo "::error::${SYNC_BRANCH} does not contain ${UPSTREAM_MIRROR_BRANCH}; refusing to update Matrix pilot"
            exit 1
          fi

          git push origin "${actual_head}:refs/heads/${BASE_BRANCH}"
