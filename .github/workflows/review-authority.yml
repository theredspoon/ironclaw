name: Review Authority

on:
  pull_request_target:
    branches:
      - reborn-matrix-pilot
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  review-authority:
    name: Review Authority
    if: >-
      github.repository == 'theredspoon/ironclaw' &&
      github.event.pull_request.base.ref == 'reborn-matrix-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pinned Lighthouse guard
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: enjimi/lighthouse
          ref: b7938365ae4bfcc2b00aa59e08478fa127abfc0c
          path: lighthouse-tools
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Verify base-controlled review authority
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          uv run --frozen --project lighthouse-tools \
            python lighthouse-tools/scripts/review/review-authority-guard.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --expected-head "$PR_HEAD_SHA" \
            --schema lighthouse-tools/schemas/required-check-policy.schema.json \
            --allow-policy-change \
            --protected-path deny.toml \
            --out "$RUNNER_TEMP/review-authority.json"
