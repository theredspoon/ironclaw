[package]
name = "ironclaw_matrix_adapter"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Pure Matrix parse/render adapter contracts for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "products"

[dependencies]
ammonia = "4"
chrono = { version = "0.4", features = ["serde"] }
ironclaw_product_adapters = { path = "../ironclaw_product_adapters", version = "0.1.0" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
ironclaw_turns = { path = "../ironclaw_turns", version = "0.1.0" }
