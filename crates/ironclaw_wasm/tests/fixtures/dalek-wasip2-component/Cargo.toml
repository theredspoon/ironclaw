[package]
name = "dalek-wasip2-component"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["alloc"] }
vodozemac = { version = "=0.10.0", default-features = false }
wit-bindgen = { version = "=0.41.0", default-features = false, features = ["macros"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["getrandom", "static_secrets", "zeroize"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
