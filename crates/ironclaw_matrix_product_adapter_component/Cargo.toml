[package]
name = "ironclaw_matrix_product_adapter_component"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Matrix ProductAdapter WASM component for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[lib]
crate-type = ["rlib"]

[package.metadata.ironclaw]
layer = "products"

[dependencies]
ammonia = "4"
ironclaw_matrix_adapter = { path = "../ironclaw_matrix_adapter", version = "0.1.0" }
pulldown-cmark = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
wit-bindgen = "0.57.1"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
ironclaw_product_adapters = { path = "../ironclaw_product_adapters", version = "0.1.0", features = ["test-support"] }
ironclaw_turns = { path = "../ironclaw_turns", version = "0.1.0" }
ironclaw_wasm_product_adapters = { path = "../ironclaw_wasm_product_adapters", version = "0.1.0" }
